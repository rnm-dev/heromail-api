openapi: 3.0.3

info:
  title: Heromail API
  version: 0.1.0
  description: |
    Corporate mail service.

    This document is the source of truth for the HTTP contract. The Go server
    interface is generated from it, so an endpoint declared here that nobody
    implements fails to compile — the spec cannot quietly drift from the code.

    Two independent bearer credentials exist, and they are not interchangeable:

    * **session** — a signed-in person, issued by `/auth/login`. Guards `/auth/me`,
      `/auth/logout` and everything under `/workspaces`. Mobile sessions
      (`client: ios|android`) carry a short access token renewed through
      `/auth/refresh`; an expired one is `401 access_token_expired`.
    * **apiKey** — a machine acting for one workspace, `hm_live_…`. Guards `/v1/*`.

servers:
  - url: https://api-dev-heromail.rnm.dev
    description: dev
  - url: http://localhost:8060
    description: local

tags:
  - name: health
  - name: auth
    description: Human authentication.
  - name: workspaces
    description: Tenants. Reached with a session, not an API key.
  - name: emails
    description: Sending. Reached with a workspace API key.

security: []

paths:
  /assistant-keys:
    get:
      operationId: listAssistantKeys
      security: [{ session: [] }]
      summary: Mailboxes the signed-in user owns, with their AI assistant key status
      responses:
        '200':
          description: Owned mailboxes
          content:
            application/json:
              schema:
                type: object
                required: [mailboxes]
                properties:
                  mailboxes: { type: array, items: { $ref: '#/components/schemas/AssistantKey' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /assistant-keys/{mailboxId}:
    parameters:
      - { name: mailboxId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: issueAssistantKey
      security: [{ session: [] }]
      summary: Issue or rotate the personal AI assistant key (IMAP + SMTP) for an owned mailbox
      responses:
        '201':
          description: New key, shown once
          content:
            application/json:
              schema:
                type: object
                required: [key, mailbox]
                properties:
                  key: { type: string }
                  mailbox: { $ref: '#/components/schemas/AssistantKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteAssistantKey
      security: [{ session: [] }]
      responses:
        '204': { description: Key revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workspaces/{slug}/mailboxes/{mailboxId}/automation:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: mailboxId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMailAutomation
      security: [{ session: [] }]
      responses:
        '200':
          description: Mailbox rules and vacation response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailAutomation' }
        default:
          description: Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: saveMailAutomation
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailAutomation' }
      responses:
        '200':
          description: Saved settings with incremented version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailAutomation' }
        default:
          description: Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workspaces/{slug}/mailboxes/{mailboxId}/organization:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: mailboxId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMailOrganization
      security: [{ session: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailOrganization' }
        default:
          description: Authorization, validation or conflict error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workspaces/{slug}/mailboxes/{mailboxId}/organization/folders:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: mailboxId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveMailFolder
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                old_name: { type: string }
                uidvalidity: { type: integer, format: int64 }
      responses:
        '204':
          description: Success
        default:
          description: Authorization, validation or conflict error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteMailFolder
      security: [{ session: [] }]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: uidvalidity, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204':
          description: Success
        default:
          description: Authorization, validation or conflict error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workspaces/{slug}/mailboxes/{mailboxId}/organization/labels/{labelId}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: mailboxId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: labelId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveMailLabel
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, version]
              properties:
                name: { type: string }
                version: { type: integer }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailLabel' }
        default:
          description: Authorization, validation or conflict error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteMailLabel
      security: [{ session: [] }]
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer } }
      responses:
        '204':
          description: Success
        default:
          description: Authorization, validation or conflict error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workspaces/{slug}/messages/{messageId}/labels:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMessageLabels
      security: [{ session: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageLabels' }
        default:
          description: Authorization, validation or conflict error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: changeMessageLabel
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, applied]
              properties:
                id: { type: string, format: uuid }
                applied: { type: boolean }
      responses:
        '204':
          description: Success
        default:
          description: Authorization, validation or conflict error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /contacts:
    get:
      operationId: listContacts
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Private address book, 50 per page, case-insensitive name/email search
          content:
            application/json:
              schema:
                type: object
                required: [contacts, has_more]
                properties:
                  contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /contacts/suggestions:
    get:
      operationId: suggestRecipients
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200':
          description: Up to 8 addresses from the private address book, then senders of accessible received mail and recipients of the user's sent mail
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items: { $ref: '#/components/schemas/RecipientSuggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /contacts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveContact
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, version]
              properties:
                name: { type: string, maxLength: 200 }
                email: { type: string, maxLength: 254 }
                version: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Saved; version zero creates, later writes compare versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale version or duplicate email in this user's address book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteContact
      security: [{ session: [] }]
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale version or duplicate email in this user's address book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workspaces/{slug}/mail-signatures:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      operationId: listMailSignatures
      security: [{ session: [] }]
      responses:
        '200':
          description: Own signatures for currently accessible senders
          content:
            application/json:
              schema:
                type: object
                required: [signatures]
                properties:
                  signatures: { type: array, items: { $ref: '#/components/schemas/MailSignature' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveMailSignature
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailSignature' }
      responses:
        '200':
          description: Saved; empty text disables the signature without resetting version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSignature' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Signature changed on another device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /messages/drafts:
    get:
      operationId: listDrafts
      security: [{ session: [] }]
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Own drafts in current workspaces, newest first, 50 per page
          content:
            application/json:
              schema:
                type: object
                required: [drafts, has_more]
                properties:
                  drafts: { type: array, items: { $ref: '#/components/schemas/MailDraft' } }
                  has_more: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /workspaces/{slug}/drafts/{id}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDraft
      security: [{ session: [] }]
      responses:
        '200':
          description: Draft snapshot; version zero creates, subsequent writes compare versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Changed on another device or already being sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: saveDraft
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, data]
              properties:
                version: { type: integer, minimum: 0 }
                data: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Draft snapshot; version zero creates, subsequent writes compare versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Changed on another device or already being sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteDraft
      security: [{ session: [] }]
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Changed on another device or already being sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workspaces/{slug}/emails/{id}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getWorkspaceEmail
      tags: [emails]
      summary: Read a queued message and its sending status as a workspace member
      security: [{ session: [] }]
      responses:
        '200':
          description: Message status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Email' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workspaces/{slug}/attachments:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      operationId: uploadWorkspaceAttachment
      tags: [emails]
      summary: Upload a file as a workspace member
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Storage not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workspaces/{slug}/members:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      operationId: listMembers
      tags: [workspaces]
      summary: Owner-only workspace member management
      security: [{ session: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        default:
          description: Error (400 invalid input, 401 unauthenticated, 403 owner required, 404 not found, 409 conflict)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: addMember
      tags: [workspaces]
      summary: Owner-only workspace member management
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMemberRequest' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        default:
          description: Error (400 invalid input, 401 unauthenticated, 403 owner required, 404 not found, 409 conflict)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workspaces/{slug}/users:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      operationId: provisionWorkspaceUser
      tags: [workspaces]
      summary: Provision a member with a private mailbox and temporary password
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionWorkspaceUserRequest' }
      responses:
        '201':
          description: User provisioned; temporary_password is returned only in this response
          headers:
            Cache-Control:
              required: true
              schema: { type: string }
              description: Prevents storage of the one-time credential response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionWorkspaceUserResponse' }
        default:
          description: Error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workspaces/{slug}/members/{userId}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateMember
      tags: [workspaces]
      summary: Owner-only workspace member management
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRequest' }
      responses:
        '204':
          description: Success
        default:
          description: Error (400 invalid input, 401 unauthenticated, 403 owner required, 404 not found, 409 conflict)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: removeMember
      tags: [workspaces]
      summary: Owner-only workspace member management
      security: [{ session: [] }]
      responses:
        '204':
          description: Success
        default:
          description: Error (400 invalid input, 401 unauthenticated, 403 owner required, 404 not found, 409 conflict)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness and database reachability
      security: []
      responses:
        '200':
          description: Everything is reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: A dependency is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account and start a session
      description: |
        Signs the user in immediately and sends a verification link in the
        background. The address is not verified yet; see `user.email_verified`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credentials' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: The address is already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credentials' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            Wrong password or unknown address — deliberately indistinguishable,
            so the endpoint cannot be used to discover which addresses exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an address with the emailed one-time code
      description: |
        Wrong codes are counted. After 7 failures the code is locked for a
        while and even the correct one is refused — otherwise the lock would
        tell an attacker exactly when they guessed right.

        A wrong code and an address with no pending code are reported
        identically, so this cannot be used to discover which addresses are
        registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200':
          description: Address verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400':
          description: The code is wrong, expired or already used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Send a fresh verification link
      description: |
        Always answers 202, whether or not the address is registered. Any other
        behaviour would be an account-enumeration oracle. Issuing a new link
        invalidates the previous one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResendVerificationRequest' }
      responses:
        '202':
          description: Accepted, whether or not anything was sent
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Send a password reset link
      description: |
        Always answers 202, whether or not the address is registered — any other
        behaviour would be an account-enumeration oracle. Issuing a new link
        invalidates the previous one.

        Accounts that sign in only through SSO have no password to reset and
        receive nothing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202':
          description: Accepted, whether or not anything was sent
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password from a reset link
      description: |
        Consumes the emailed token, sets the new password, and **revokes every
        existing session** — a reset is what someone does when they believe the
        account is compromised, so leaving the attacker's session alive would
        defeat it.

        Reading the link also proves control of the address, so the account's
        email is marked verified if it was not already.

        The response is a fresh session for the browser that performed the
        reset, in the same shape as login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password changed; every other session is gone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credentials' }
        '400':
          description: The token is unknown, expired or already used, or the password is too weak
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/change-initial-password:
    post:
      tags: [auth]
      operationId: changeInitialPassword
      summary: Replace an administrator-issued initial password
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password]
              properties:
                current_password: { type: string }
                password: { type: string }
                client: { $ref: '#/components/schemas/SessionClient' }
                device_name: { type: string, maxLength: 200 }
                app_version: { type: string, maxLength: 50 }
      responses:
        '200':
          description: Password replaced, old sessions revoked and a fresh session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credentials' }
        default:
          description: Authentication, validation or state error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Replace the signed-in user's password
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password]
              properties:
                current_password: { type: string }
                password: { type: string }
                client: { $ref: '#/components/schemas/SessionClient' }
                device_name: { type: string, maxLength: 200 }
                app_version: { type: string, maxLength: 50 }
      responses:
        '200':
          description: Password replaced, all sessions revoked and a fresh session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credentials' }
        default:
          description: Authentication, validation or state error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The user behind the current session
      security: [{ session: [] }]
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      security: [{ session: [] }]
      responses:
        '204':
          description: Session revoked
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate a mobile session's tokens
      description: |
        Spends the refresh token and returns a new access token and a new
        refresh token. The previous access token stops working immediately.

        **Reuse detection.** A refresh token works once. Presenting one that
        was already rotated means two parties hold the chain; the server
        cannot tell which is legitimate, so it revokes the whole session and
        answers `401 refresh_token_reused`. Clients must therefore serialise
        refreshes and persist the new refresh token before using the new
        access token.

        Any protected endpoint answers `401 access_token_expired` once the
        access token's `expiresAt` has passed; that is the signal to call this.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credentials' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            `invalid_refresh_token` — unknown, expired or revoked;
            `refresh_token_reused` — an old token was replayed and the session
            is now revoked. Both mean: sign in again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: The signed-in user's live sessions (devices)
      security: [{ session: [] }]
      responses:
        '200':
          description: Live sessions, most recently active first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: Sign one of your devices out
      description: |
        Revokes the session, its refresh chain and its push registration.
        Revoking the current session is the same as `/auth/logout`.
      security: [{ session: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/push:
    put:
      tags: [auth]
      operationId: registerPushDevice
      summary: Register this session's FCM token
      description: |
        Upserts the push registration of the current session — one token per
        session (one app install). A token already registered by another
        session, including another user's, moves to this one: a token belongs
        to exactly one session. Re-registering clears a previous `disabled`
        mark (FCM `UNREGISTERED`).

        The registration disappears when the session ends — logout,
        `DELETE /auth/sessions/{id}`, refresh-token reuse, password change or
        reset.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRegistration' }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushDevice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [auth]
      operationId: unregisterPushDevice
      summary: Stop push notifications for this session
      description: Idempotent — answers 204 whether or not anything was registered.
      security: [{ session: [] }]
      responses:
        '204':
          description: No registration remains for this session
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notification-settings:
    get:
      tags: [auth]
      operationId: getNotificationSettings
      summary: The signed-in user's push notification settings
      description: |
        Lists every mailbox the user can read, with defaults for mailboxes
        never configured. A user who has never saved anything gets version 0
        and the defaults:

        * `enabled: true`, `privacy: false`, no `quiet_hours`;
        * per mailbox: `enabled: true`, `categories: [people]`,
          `starred_only: false`.

        These settings decide only the visible new-mail push. The silent
        `type: sync` push is never muted, so the app stays in sync and the
        badge stays right even for a muted mailbox.
      security: [{ session: [] }]
      responses:
        '200':
          description: Current settings
          headers:
            ETag:
              schema: { type: string }
              description: '`"<version>"`; send it back as `If-Match`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [auth]
      operationId: saveNotificationSettings
      summary: Replace the global switches and update the listed mailboxes
      description: |
        Optimistic: `version` must be the version last read (`If-Match`, when
        sent, must agree with it). Global fields are replaced; `quiet_hours`
        absent or null turns quiet hours off. Mailboxes not listed keep their
        settings. A mailbox the user cannot read is `404`. Resending the write
        that produced the current version is not a conflict.
      security: [{ session: [] }]
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettingsUpdate' }
      responses:
        '200':
          description: Saved
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`version_conflict` — changed on another device; GET and reapply'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: Workspaces the signed-in user belongs to
      security: [{ session: [] }]
      responses:
        '200':
          description: The user's workspaces, with their role in each
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace
      description: The creator becomes its owner.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The slug is taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: One workspace by slug
      description: |
        A workspace the user does not belong to is reported as absent, so
        membership cannot be probed by slug.
      security: [{ session: [] }]
      responses:
        '200':
          description: The workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: Delete a workspace and everything under it
      description: |
        Owner only. Domains, mailboxes, messages, API keys and sent mail all
        cascade — this is not reversible.

        A workspace the caller cannot see is `404` and one they can see but do
        not own is `403`, the same distinction the domain endpoints draw.
      security: [{ session: [] }]
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{slug}/domains:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
    get:
      tags: [domains]
      operationId: listDomains
      summary: Mail domains owned by the workspace
      security: [{ session: [] }]
      responses:
        '200':
          description: The workspace's domains
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [domains]
      operationId: addDomain
      summary: Claim a domain
      description: |
        Records the claim and returns the DNS records to publish. The domain is
        not usable until verified. Domains are globally unique: a domain
        already claimed by another workspace is refused.

        Requires the `admin` role or above.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddDomainRequest' }
      responses:
        '201':
          description: Claimed, pending verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The domain is already claimed, here or by another workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/domains/{domain}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
      - name: domain
        in: path
        required: true
        schema: { $ref: '#/components/schemas/DomainName' }
    get:
      tags: [domains]
      operationId: getDomain
      summary: One domain
      security: [{ session: [] }]
      responses:
        '200':
          description: The domain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [domains]
      operationId: updateDomain
      summary: Make a domain the workspace default
      description: |
        Only a verified domain may become primary, and a workspace has at most
        one. Requires the `admin` role or above.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDomainRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [domains]
      operationId: deleteDomain
      summary: Release a domain
      description: Requires the `admin` role or above.
      security: [{ session: [] }]
      responses:
        '204':
          description: Released
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{slug}/domains/{domain}/verify:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
      - name: domain
        in: path
        required: true
        schema: { $ref: '#/components/schemas/DomainName' }
    post:
      tags: [domains]
      operationId: verifyDomain
      summary: Check the DNS challenge now
      description: |
        Resolves the challenge TXT record and, on a match, marks the domain
        verified. A failure is not an error: the domain comes back with
        `last_error` describing what was found, which is what the UI shows.

        Requires the `admin` role or above.
      security: [{ session: [] }]
      responses:
        '200':
          description: The check ran; inspect `verified` and `last_error`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{slug}/domains/{domain}/dkim/rotate:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
      - name: domain
        in: path
        required: true
        schema: { $ref: '#/components/schemas/DomainName' }
    post:
      tags: [domains]
      operationId: rotateDkimKey
      summary: Mint a replacement DKIM key
      description: |
        Creates a new key in the **pending** state and returns the domain with
        its record added to `dns_records`. Signing does not switch yet: publish
        the new record, then call verify, which promotes the pending key and
        retires the one that was signing.

        Two steps on purpose — switching signer before DNS propagates makes
        every message sent in the gap fail DKIM. The retired key stays listed
        so the customer knows not to delete its record yet.

        Requires the `admin` role or above.
      security: [{ session: [] }]
      responses:
        '200':
          description: A pending key was created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/workspace:
    get:
      tags: [emails]
      operationId: getApiKeyWorkspace
      summary: The workspace the API key belongs to
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: The workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /messages/unread-counts:
    get:
      operationId: getUnreadCounts
      security: [{ session: [] }]
      parameters:
        - name: box
          in: query
          required: false
          description: Count only this mailbox; without it, every accessible mailbox.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Unread counts across accessible mailboxes by folder, plus starred
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workspaces/{slug}/messages/{messageId}/category:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setMessageCategory
      summary: Correct a message's Inbox category, optionally for its whole sender
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category: { $ref: '#/components/schemas/MessageCategory' }
                remember_sender:
                  type: boolean
                  default: true
                  description: Apply to the sender's existing and future messages in this mailbox.
      responses:
        '200':
          description: Number of messages updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        default:
          description: Update failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/messages/{messageId}/flags:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateMessageFlags
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                read: { type: boolean }
                starred: { type: boolean }
      responses:
        '200':
          description: Updated message flags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceivedMessage' }
        default:
          description: Update failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/messages/{messageId}/raw:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadReceivedRaw
      security: [{ session: [] }]
      responses:
        '200':
          description: Original MIME message as a forced download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /messages/received-search:
    get:
      operationId: searchReceivedMessages
      security: [{ session: [] }]
      summary: Search accessible received messages with global pagination
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: from, in: query, schema: { type: string, maxLength: 320 } }
        - { name: to, in: query, schema: { type: string, maxLength: 320 } }
        - { name: after, in: query, description: First received date inclusive in UTC (YYYY-MM-DD), schema: { type: string } }
        - { name: before, in: query, description: Last received date inclusive in UTC (YYYY-MM-DD), schema: { type: string } }
        - { name: attachments, in: query, schema: { type: boolean } }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: starred, in: query, schema: { type: boolean } }
        - { name: box, in: query, schema: { type: string, format: uuid } }
        - { name: folder, in: query, schema: { type: string, default: INBOX } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Matching messages ordered by received date and ID descending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceivedSearchPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /messages/search:
    get:
      tags: [emails]
      operationId: searchMessages
      summary: Search messages visible to the signed-in user
      description: Searches stored outbound messages across all workspaces the user belongs to.
      security: [{ session: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Matching messages, newest first
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Email' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /messages/sent:
    get:
      tags: [emails]
      operationId: listSentMessages
      summary: List sent messages visible to the signed-in user
      description: Lists only successfully sent messages across member workspaces, respecting private mailbox ownership.
      security: [{ session: [] }]
      parameters:
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Matching messages, newest first
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Email' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/emails:
    post:
      tags: [emails]
      operationId: sendEmail
      summary: Queue a message for sending
      description: |
        **Asynchronous.** The message is recorded and handed to the queue; the
        request does not wait for the mail transport. Poll `GET /v1/emails/{id}`
        for the outcome, or read the event trail.

        This is why there is no `502` here any more: at the time we answer,
        nobody has talked to a mail server yet. A transport failure surfaces as
        `status: failed` on the message, and the worker retries with backoff
        until it gives up and marks it `dead`.
      security: [{ apiKey: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Scoped to the workspace. Repeating a request with the same key
            returns the original message and does not send again. Omitting it
            means no deduplication at all.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendEmailRequest' }
      responses:
        '202':
          description: |
            Queued. For a repeated idempotency key this returns the original
            message unchanged, whatever state it has reached by now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendEmailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{slug}/mailboxes:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
    get:
      tags: [inbound]
      operationId: listMailboxes
      summary: Addresses this workspace receives mail at
      security: [{ session: [] }]
      responses:
        '200':
          description: The workspace's mailboxes
          content:
            application/json:
              schema:
                type: object
                required: [mailboxes]
                properties:
                  mailboxes:
                    type: array
                    items: { $ref: '#/components/schemas/Mailbox' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [inbound]
      operationId: createMailbox
      summary: Start receiving mail at an address
      description: |
        The domain must already be verified. Accepting mail for a domain whose
        ownership was never proven would let anyone who typed a name into the
        UI intercept somebody else's mail by pointing its MX here.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMailboxRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: That address already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/mailboxes/{mailboxId}/smtp-password:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
      - { name: mailboxId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setMailboxSMTPPassword
      security: [{ session: [] }]
      summary: Owner or admin delegates send-only SMTP access with a mailbox password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 12, maxLength: 72, writeOnly: true }
      responses:
        '204': { description: SMTP password set or rotated }
        default:
          description: Password update failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteMailboxSMTPPassword
      security: [{ session: [] }]
      responses:
        '204': { description: Dedicated SMTP password revoked }
        default:
          description: Revocation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/mailboxes/{mailboxId}/members:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
      - { name: mailboxId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setMailboxMembers
      summary: Replace the extra employees with access to a private mailbox (workspace owner only)
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Updated mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        default:
          description: Update failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/mailboxes/{mailboxId}/owner:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
      - { name: mailboxId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: assignMailboxOwner
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_user_id]
              properties:
                owner_user_id: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Updated mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        default:
          description: Assignment failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/mailboxes/{mailboxId}/changes:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
      - name: mailboxId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [inbound]
      operationId: listMailboxChanges
      summary: Changes to a mailbox since a cursor (delta sync)
      description: |
        Returns messages created or changed (flags, folder, labels, category)
        and ids deleted after `cursor`, oldest change first, in the same card
        shape as the message list minus `html`. A message appears once per
        page with its current state, however many times it changed.

        Every write path is covered — web, IMAP, LMTP delivery and automation
        rules — because changes are numbered by database triggers at commit.

        Sync protocol:

        1. Call without `cursor` and keep `next_cursor`.
        2. Fetch the full lists you cache.
        3. Call with the kept cursor; apply, store `next_cursor`, repeat while
           `has_more`. Changes made between steps 1 and 2 are simply applied
           again, which is harmless because each item is the current state.

        `organization_changed` means folder or label definitions changed:
        refetch `/organization`. `unread` always carries current per-folder
        unread counts.

        `410 cursor_expired` — unknown, foreign or too old cursor (deletions
        are kept 30 days): drop the cache and resync from step 1.
      security: [{ session: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: A page of changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailboxChanges' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: The cursor cannot be served; resync from scratch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/mailboxes/{mailboxId}/messages:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
      - name: mailboxId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [inbound]
      operationId: listMessages
      summary: Received mail with server-side filters, newest first
      security: [{ session: [] }]
      parameters:
        - { name: label, in: query, schema: { type: string, format: uuid } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/MessageCategory' } }
        - name: unread
          in: query
          schema: { type: boolean, default: false }
        - name: starred
          in: query
          schema: { type: boolean, default: false }
        - name: folder
          in: query
          schema: { type: string, default: INBOX }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: q
          in: query
          required: false
          description: |
            Free-text filter over subject, sender and body. Absent or blank
            returns the folder unfiltered.
          schema: { type: string, maxLength: 200 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/ReceivedMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{slug}/messages/{messageId}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [inbound]
      operationId: getMessage
      summary: One received message
      security: [{ session: [] }]
      responses:
        '200':
          description: The message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceivedMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [inbound]
      operationId: markMessageRead
      summary: Mark a message read
      security: [{ session: [] }]
      responses:
        '200':
          description: The message, now read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceivedMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{slug}/messages/{messageId}/attachments/{attachmentId}:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attachmentId, in: path, required: true, schema: { type: string, pattern: '^[0-9]{1,3}$' } }
    get:
      operationId: downloadReceivedAttachment
      security: [{ session: [] }]
      responses:
        '200':
          description: Decoded attachment bytes, forced download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workspaces/{slug}/messages/{messageId}/calendar-reply:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [inbound]
      operationId: replyMessageCalendar
      summary: Answer an external calendar invitation from the receiving mailbox
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarResponseRequest' }
      responses:
        '200':
          description: REPLY queued to the organizer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarPreview' }
        default:
          description: Reply failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/messages/{messageId}/folder:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: moveReceivedMessage
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder]
              properties:
                expected_folder: { type: string }
                folder: { type: string }
      responses:
        '200':
          description: Message in its destination folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceivedMessage' }
        default:
          description: Move failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/emails:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
    post:
      tags: [emails]
      operationId: sendWorkspaceEmail
      summary: Send a message as a signed-in person
      description: |
        The same pipeline as `POST /v1/emails`, reached with a session instead
        of an API key — so the mail client in the browser can send without
        anyone putting a workspace key into a page.

        The two are not merged because the credentials are not
        interchangeable: a key belongs to a machine and grants exactly one
        workspace, while a session belongs to a person who may belong to
        several. Membership is what authorises this one.
      security: [{ session: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendEmailRequest' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendEmailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{slug}/api-keys:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
    get:
      tags: [workspaces]
      operationId: listApiKeys
      summary: The workspace's API keys
      description: |
        Never returns a usable key — only the prefix, which identifies a key in
        a list without authenticating anything.
      security: [{ session: [] }]
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [workspaces]
      operationId: createApiKey
      summary: Issue an API key
      description: |
        Admin only. **The plaintext key is in this response and nowhere else** —
        only its digest is stored, so it cannot be shown again.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Created. `key` is shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyWithSecret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{slug}/api-keys/{keyId}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slug' }
      - name: keyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [workspaces]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: |
        Admin only. The row is kept and stamped `revoked_at` rather than
        deleted, so the key that signed past sends stays identifiable.
      security: [{ session: [] }]
      responses:
        '204':
          description: Revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/attachments:
    post:
      tags: [emails]
      operationId: uploadAttachment
      summary: Upload a file to attach to a later message
      description: |
        Stores the file in object storage and returns an id. Reference that id
        in `SendEmailRequest.attachments` to send it; an upload that is never
        referenced is an orphan and goes nowhere.

        `503` means the deployment has no bucket configured yet — attachments
        are wired end to end before credentials exist, this is not a bug.
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: The file, or the multipart body, is too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Attachment storage is not configured on this deployment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/emails/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [emails]
      operationId: getEmail
      summary: One message
      description: |
        Scoped to the API key's workspace. Another workspace's message is
        reported as absent.
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: The message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Email' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{slug}/calendar:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
    get:
      operationId: getCalendar
      security: [{ session: [] }]
      responses:
        '200':
          description: Personal calendar settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarSettings' }
        default:
          description: Calendar operation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateCalendar
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarSettings' }
      responses:
        '200':
          description: Personal calendar settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarSettings' }
        default:
          description: Calendar operation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/calendar/events:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
    get:
      operationId: listCalendarEvents
      security: [{ session: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string }, description: Inclusive local date YYYY-MM-DD }
        - { name: to, in: query, required: true, schema: { type: string }, description: Exclusive local date YYYY-MM-DD; maximum 93-day range }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        '200':
          description: Personal events intersecting the range in calendar timezone
          content:
            application/json:
              schema:
                type: object
                required: [events, has_more]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
                  has_more: { type: boolean }
        default:
          description: Calendar operation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createCalendarEvent
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarEventInput' }
      responses:
        '201':
          description: Created personal event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEvent' }
        default:
          description: Calendar operation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/calendar/events/{eventId}:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateCalendarEvent
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarEventInput' }
      responses:
        '200':
          description: Updated personal event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEvent' }
        default:
          description: Calendar operation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteCalendarEvent
      security: [{ session: [] }]
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: Deleted personal event }
        default:
          description: Calendar operation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /calendar/invite/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCalendarInvite
      security: []
      responses:
        '200':
          description: Invitation for one recipient
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarInvitation' }
        default:
          description: Invitation unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: respondCalendarInvite
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarResponseRequest' }
      responses:
        '200':
          description: Response recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarInvitation' }
        default:
          description: Response failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workspaces/{slug}/calendar/imports/{token}:
    parameters:
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/Slug' } }
      - { name: token, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: importCalendarInvite
      security: [{ session: [] }]
      responses:
        '200':
          description: Invitation in the user's personal calendar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEvent' }
        default:
          description: Import failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: Session token from `/auth/register` or `/auth/login`.
    apiKey:
      type: http
      scheme: bearer
      description: Workspace API key, `hm_live_…`, minted by the issue-api-key command.

  responses:
    BadRequest:
      description: The request is malformed or fails validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, malformed, expired or revoked credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource within the caller's scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: |
        The caller is over a rate limit. `Retry-After` carries the number of
        seconds until the window resets.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the limit resets.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Authenticated, but the caller's role in this workspace is too low.
        Distinct from 404: the resource exists and they can see it, they just
        may not change it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    AssistantKey:
      type: object
      required: [mailbox_id, address]
      properties:
        mailbox_id: { type: string, format: uuid }
        address: { type: string }
        key_prefix: { type: string, description: Present when a key exists }
        created_at: { type: string, format: date-time }
    MailFolder:
      type: object
      required: [name, uidvalidity, system, total, unread]
      properties:
        name: { type: string }
        uidvalidity: { type: integer, format: int64 }
        system: { type: boolean }
        total: { type: integer }
        unread: { type: integer }
    MailLabel:
      type: object
      required: [id, name, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        unread: { type: integer, description: Unread labelled messages outside Junk and Trash; organization listing only. }
    MailAutomation:
      type: object
      required: [version, rules, vacation]
      properties:
        pending_replies: { type: integer, readOnly: true }
        failed_replies: { type: integer, readOnly: true }
        version: { type: integer, minimum: 0 }
        rules:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MailRule' }
        vacation: { $ref: '#/components/schemas/MailVacation' }
    MailRule:
      type: object
      required: [name, enabled, from, subject, mark_read, stop]
      properties:
        name: { type: string, maxLength: 80 }
        enabled: { type: boolean }
        from: { type: string }
        subject: { type: string }
        category: { $ref: '#/components/schemas/MessageCategory' }
        folder_uidvalidity: { type: integer, format: int64 }
        label_id: { type: string, format: uuid }
        mark_read: { type: boolean }
        stop: { type: boolean }
    MailVacation:
      type: object
      required: [enabled, subject, text]
      properties:
        enabled: { type: boolean }
        subject: { type: string }
        text: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    MailOrganization:
      type: object
      required: [folders, labels]
      properties:
        folders: { type: array, items: { $ref: '#/components/schemas/MailFolder' } }
        labels: { type: array, items: { $ref: '#/components/schemas/MailLabel' } }
    MessageLabels:
      type: object
      required: [labels]
      properties:
        labels: { type: array, items: { $ref: '#/components/schemas/MailLabel' } }
    Contact:
      type: object
      required: [id, name, email, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        version: { type: integer }
    RecipientSuggestion:
      type: object
      required: [name, email, source]
      properties:
        name: { type: string }
        email: { type: string }
        source: { type: string, enum: [contact, received, sent] }
    MailSignature:
      type: object
      required: [sender, text, version]
      properties:
        sender: { type: string, format: email }
        text: { type: string, maxLength: 10000 }
        version: { type: integer, minimum: 0 }
    MailDraft:
      type: object
      required: [id, workspace, version, data, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace: { type: string }
        version: { type: integer }
        data: { type: object, additionalProperties: true }
        updated_at: { type: string, format: date-time }
    CalendarSettings:
      type: object
      required: [timezone]
      properties:
        timezone: { type: string }
    CalendarInvitation:
      type: object
      x-go-type: calendar.Invitation
      x-go-type-import:
        path: github.com/rnm/heromail/backend/internal/calendar
        name: calendar
      required: [event, recipient, response]
      properties:
        event: { $ref: '#/components/schemas/CalendarEvent' }
        recipient: { type: string, format: email }
        response: { type: string }
    CalendarResponseRequest:
      type: object
      x-go-type: calendar.ResponseRequest
      x-go-type-import:
        path: github.com/rnm/heromail/backend/internal/calendar
        name: calendar
      required: [response]
      properties:
        response: { type: string, enum: [accepted, tentative, declined] }
    CalendarEventInput:
      type: object
      x-go-type: calendar.Input
      x-go-type-import:
        path: github.com/rnm/heromail/backend/internal/calendar
        name: calendar
      required: [title, description, location, timezone, all_day, start, end, version]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        location: { type: string, maxLength: 2000 }
        timezone: { type: string, description: IANA timezone }
        all_day: { type: boolean }
        start: { type: string, description: YYYY-MM-DD for all-day or local YYYY-MM-DDTHH:mm }
        end: { type: string, description: Exclusive end date or local date/time }
        version: { type: integer, minimum: 0, description: 0 on create; current version on update }
        organizer: { type: string, format: email }
        attendees: { type: array, maxItems: 20, items: { type: string, format: email } }
        reminder_minutes: { type: integer, enum: [0, 10, 30, 60] }
    CalendarEvent:
      type: object
      x-go-type: calendar.Event
      x-go-type-import:
        path: github.com/rnm/heromail/backend/internal/calendar
        name: calendar
      required: [title, description, location, timezone, all_day, start, end, version, id]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        location: { type: string, maxLength: 2000 }
        timezone: { type: string, description: IANA timezone }
        all_day: { type: boolean }
        start: { type: string, description: YYYY-MM-DD for all-day or local YYYY-MM-DDTHH:mm }
        end: { type: string, description: Exclusive end date or local date/time }
        version: { type: integer, minimum: 0, description: 0 on create; current version on update }
        organizer: { type: string, format: email }
        attendees: { type: array, items: { type: string, format: email } }
        responses: { type: array, items: { type: object, properties: { email: { type: string }, response: { type: string } } } }
        reminder_minutes: { type: integer, enum: [0, 10, 30, 60] }
        uid: { type: string }
        sequence: { type: integer }
        status: { type: string }
        role: { type: string, enum: [organizer, attendee] }
        invite_token: { type: string, format: uuid }
        id: { type: string, format: uuid }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
    Member:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { type: string, enum: [admin, member] }
    ProvisionWorkspaceUserRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
    ProvisionWorkspaceUserResponse:
      type: object
      required: [user, temporary_password]
      properties:
        user: { $ref: '#/components/schemas/Member' }
        temporary_password: { type: string, writeOnly: true }
    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [admin, member] }
    Error:
      type: object
      required: [error]
      description: |
        The single error envelope for the whole API. `/v1/*` used to return a
        bare `{"error":"text"}`, which the frontend client could not read.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable. Branch on this, not on the message.
              example: validation_failed
            message:
              type: string
              description: Human-readable, safe to show a user.
            details:
              description: Optional per-field or per-code extra context.

    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unreachable] }

    Slug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
      description: Lowercase tenant handle used in URLs.
      example: acme

    Role:
      type: string
      enum: [owner, admin, member]

    User:
      type: object
      required: [id, email, name, email_verified, must_change_password, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        must_change_password: { type: boolean }
        email_verified:
          type: boolean
          description: Derived from `email_verified_at`; the flag the UI wants.
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }

    Credentials:
      type: object
      required: [token, user, expiresAt, sessionId]
      description: |
        A web session (no `client`, or `client: web`) gets one bearer token that
        lives until `expiresAt` (30 days), exactly as before.

        A mobile session (`client: ios|android`) gets a short-lived access
        token (`token`, until `expiresAt`, ~15 minutes) and a `refreshToken`
        that renews it through `POST /auth/refresh` until `refreshExpiresAt`
        (90 days, sliding on every refresh).
      properties:
        token:
          type: string
          description: Session bearer token. Shown once; not recoverable.
        user: { $ref: '#/components/schemas/User' }
        expiresAt:
          type: string
          format: date-time
          description: When `token` stops working.
        sessionId:
          type: string
          format: uuid
          description: Matches `DeviceSession.id`; push registrations hang off it.
        refreshToken:
          type: string
          description: Mobile sessions only. Single use — every refresh returns a successor.
        refreshExpiresAt:
          type: string
          format: date-time
          description: Mobile sessions only. When the session ends unless refreshed.

    SessionClient:
      type: string
      enum: [web, ios, android]
      description: |
        Which app holds the session. `ios` and `android` get a refresh token;
        `web` (and an absent value) keeps the original single-token session.

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string }
        app_version:
          type: string
          maxLength: 50
          description: Updates the version shown in the devices list after an app upgrade.

    DeviceSession:
      type: object
      required: [id, client, current, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        client: { $ref: '#/components/schemas/SessionClient' }
        device_name: { type: string, nullable: true }
        app_version: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        current:
          type: boolean
          description: True for the session this request was made with.
        created_at: { type: string, format: date-time }
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Stamped at most every 5 minutes, and on every refresh.
        expires_at: { type: string, format: date-time }

    PushRegistration:
      type: object
      required: [token, platform]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: FCM registration token (iOS too — APNs goes through Firebase).
        platform: { type: string, enum: [ios, android] }
        provider:
          type: string
          enum: [fcm]
          default: fcm
        locale: { type: string, maxLength: 35, example: ru-KZ }
        timezone: { type: string, maxLength: 64, example: Asia/Almaty }
        app_version: { type: string, maxLength: 50 }

    PushDevice:
      type: object
      required: [id, session_id, platform, provider, disabled, created_at, last_seen_at]
      description: A registration. The token itself is never echoed back.
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        provider: { type: string, enum: [fcm] }
        locale: { type: string, nullable: true }
        timezone: { type: string, nullable: true }
        app_version: { type: string, nullable: true }
        disabled:
          type: boolean
          description: FCM reported the token as no longer valid; nothing is sent until it is re-registered.
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    MailboxChanges:
      type: object
      required: [messages, deleted, next_cursor, has_more, organization_changed, unread]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChangedMessage' }
        deleted:
          type: array
          description: Ids of messages deleted since the cursor.
          items: { type: string, format: uuid }
        next_cursor:
          type: string
          description: Opaque. Pass it back as `cursor`.
        has_more: { type: boolean }
        organization_changed:
          type: boolean
          description: Folder or label definitions changed; refetch `/organization`.
        unread:
          type: object
          description: Current unread count per folder.
          additionalProperties: { type: integer }

    ChangedMessage:
      type: object
      required: [message, label_ids]
      properties:
        message: { $ref: '#/components/schemas/ReceivedMessage' }
        label_ids:
          type: array
          items: { type: string, format: uuid }

    QuietHours:
      type: object
      nullable: true
      required: [start, end, timezone]
      description: |
        Local wall-clock window in `timezone` during which no visible push is
        sent (silent sync pushes still are). `start` later than `end` wraps
        midnight, e.g. 22:00–08:00.
      properties:
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '22:00' }
        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '08:00' }
        timezone: { type: string, maxLength: 64, example: Asia/Almaty }

    MailboxNotificationSettings:
      type: object
      required: [mailbox_id, address, workspace, enabled, categories, starred_only]
      properties:
        mailbox_id: { type: string, format: uuid }
        address: { type: string, format: email }
        workspace:
          type: string
          description: Workspace slug the mailbox is reached under.
        enabled: { type: boolean, default: true }
        categories:
          type: array
          description: Smart-inbox categories that notify. Default `[people]`; empty = none.
          items: { $ref: '#/components/schemas/MessageCategory' }
        starred_only:
          type: boolean
          default: false
          description: Only messages starred on arrival, i.e. by an automation rule.

    NotificationSettings:
      type: object
      required: [version, enabled, privacy, mailboxes]
      properties:
        version: { type: integer, minimum: 0 }
        enabled:
          type: boolean
          default: true
          description: Global switch for visible new-mail pushes.
        privacy:
          type: boolean
          default: false
          description: Hide subject and preview; the notification shows the sender and "Новое письмо".
        quiet_hours: { $ref: '#/components/schemas/QuietHours' }
        mailboxes:
          type: array
          items: { $ref: '#/components/schemas/MailboxNotificationSettings' }

    MailboxNotificationUpdate:
      type: object
      required: [mailbox_id, enabled, categories, starred_only]
      additionalProperties: false
      properties:
        mailbox_id: { type: string, format: uuid }
        enabled: { type: boolean }
        categories:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/MessageCategory' }
        starred_only: { type: boolean }

    NotificationSettingsUpdate:
      type: object
      required: [version, enabled, privacy]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0
          description: The version last read.
        enabled: { type: boolean }
        privacy: { type: boolean }
        quiet_hours: { $ref: '#/components/schemas/QuietHours' }
        mailboxes:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/MailboxNotificationUpdate' }

    DeviceSessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/DeviceSession' }

    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        personal_name:
          type: string
          minLength: 3
          maxLength: 30
          deprecated: true
          description: Retained for stale clients. Nonempty values are rejected with 400; registration uses an existing email only.
        password:
          type: string
          minLength: 10
          maxLength: 72
          description: |
            Length beats composition rules. The upper bound is bcrypt's — it
            ignores anything past 72 bytes, so a longer password is refused
            rather than half-stored.
        name: { type: string, maxLength: 200 }
        client: { $ref: '#/components/schemas/SessionClient' }
        device_name: { type: string, maxLength: 200, description: 'Shown in the devices list, e.g. "iPhone 15 Pro".' }
        app_version: { type: string, maxLength: 50 }

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string }
        client: { $ref: '#/components/schemas/SessionClient' }
        device_name: { type: string, maxLength: 200, description: 'Shown in the devices list, e.g. "iPhone 15 Pro".' }
        app_version: { type: string, maxLength: 50 }

    VerifyEmailRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      description: |
        The code is presented together with the address it was sent to: the
        attempt has to be attributed to an account in order to count against
        that account's attempt budget.
      properties:
        email: { type: string, format: email }
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The six-digit code from the verification email.

    ForgotPasswordRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string }
        password:
          type: string
          minLength: 10
          maxLength: 72
          description: Same rules as registration.

    ResendVerificationRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }

    Workspace:
      type: object
      required: [id, slug, name, created_at, updated_at]
      properties:
        personal: { type: boolean }
        id: { type: string, format: uuid }
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkspaceMembership:
      allOf:
        - $ref: '#/components/schemas/Workspace'
        - type: object
          required: [role]
          properties:
            role: { $ref: '#/components/schemas/Role' }

    WorkspaceList:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceMembership' }

    CreateWorkspaceRequest:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { $ref: '#/components/schemas/Slug' }

    DomainName:
      type: string
      maxLength: 253
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
      description: Lowercase FQDN. Stored normalised, so `ACME.com` and `acme.com` are one domain.
      example: acme.com

    DnsRecord:
      type: object
      required: [type, name, value, purpose]
      description: A record the customer has to publish for the domain to work.
      properties:
        type: { type: string, example: TXT }
        name: { type: string, example: _heromail-challenge.acme.com }
        value: { type: string }
        purpose:
          type: string
          enum: [ownership, spf, dkim, dmarc]
        required:
          type: boolean
          description: |
            False for records that are recommended rather than mandatory, and
            for DKIM keys that have been retired but must stay published until
            mail signed with them has been delivered.
        status:
          type: string
          enum: [ok, missing, mismatch]
          description: |
            Only present after a check. Reads that did not resolve DNS leave it
            unset rather than guessing.
        found:
          type: array
          description: What actually resolved, so a mismatch can be shown side by side.
          items: { type: string }

    Domain:
      type: object
      required: [id, workspace_id, domain, is_primary, verified, dns_records, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        domain: { $ref: '#/components/schemas/DomainName' }
        is_primary:
          type: boolean
          description: The default domain for new mailboxes. At most one per workspace, and only ever a verified one.
        verified:
          type: boolean
          description: Derived from `verified_at`.
        verified_at: { type: string, format: date-time, nullable: true }
        last_checked_at:
          type: string
          format: date-time
          nullable: true
          description: When the DNS challenge was last resolved.
        last_error:
          type: string
          nullable: true
          description: What the last check found, when it did not match.
        dns_records:
          type: array
          description: |
            Everything to publish: ownership, SPF, a DKIM record per key, and
            DMARC. After a verify call each carries a `status`.
          items: { $ref: '#/components/schemas/DnsRecord' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DomainList:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items: { $ref: '#/components/schemas/Domain' }

    AddDomainRequest:
      type: object
      required: [domain]
      additionalProperties: false
      properties:
        domain: { $ref: '#/components/schemas/DomainName' }

    UpdateDomainRequest:
      type: object
      required: [is_primary]
      additionalProperties: false
      properties:
        is_primary:
          type: boolean
          description: Only `true` is meaningful; a workspace always has a primary once one is set.

    Mailbox:
      type: object
      required: [id, address, created_at]
      properties:
        owner_user_id: { type: string, format: uuid, nullable: true }
        member_user_ids:
          type: array
          description: Employees who, besides the owner, read and send from this private mailbox in the web UI.
          items: { type: string, format: uuid }
        smtp_password_set: { type: boolean, description: Dedicated send-only password exists; no secret is returned. }
        can_read: { type: boolean }
        can_send: { type: boolean }
        id: { type: string, format: uuid }
        address: { type: string, format: email }
        name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    CreateMailboxRequest:
      type: object
      required: [domain, local_part]
      additionalProperties: false
      properties:
        owner_user_id: { type: string, format: uuid }
        shared: { type: boolean, default: false }
        domain: { $ref: '#/components/schemas/DomainName' }
        local_part:
          type: string
          pattern: '^[a-z0-9._%+-]+$'
          description: The part before the @, lowercased.
        name: { type: string, maxLength: 200 }

    ReceivedAttachment:
      type: object
      required: [id, filename, size_bytes]
      properties:
        id: { type: string }
        filename: { type: string }
        size_bytes: { type: integer, format: int64 }

    ReceivedSearchResult:
      type: object
      required: [workspace, message]
      properties:
        workspace: { type: string }
        message: { $ref: '#/components/schemas/ReceivedMessage' }
    ReceivedSearchPage:
      type: object
      required: [messages, has_more]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/ReceivedSearchResult' }
        has_more: { type: boolean }

    MessageCategory:
      type: string
      enum: [people, notifications, newsletters]
      description: Smart inbox category; sorts the web Inbox into tabs.
    ReceivedMessage:
      type: object
      required: [id, mailbox_id, subject, size_bytes, received_at, folder, category]
      description: |
        `raw` is deliberately absent: the source of a message can be megabytes,
        and no view that lists subjects needs it.
      properties:
        to:
          type: array
          items: { type: string }
        cc:
          type: array
          items: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/ReceivedAttachment' }
        attachments_omitted: { type: boolean }
        calendar_preview: { $ref: '#/components/schemas/CalendarPreview' }

        folder: { type: string, description: Persistent IMAP folder name. }
        category: { $ref: '#/components/schemas/MessageCategory' }
        id: { type: string, format: uuid }
        mailbox_id: { type: string, format: uuid }
        envelope_from: { type: string }
        envelope_to: { type: string }
        message_id: { type: string, nullable: true }
        reply_to:
          type: array
          items: { type: string }
          description: Parsed Reply-To addresses, falling back to From; detail only.
        inline_media:
          type: object
          additionalProperties: { type: string }
          description: Content-ID to safe media data URL; authorized detail only.
        inline_media_omitted:
          type: boolean
          description: Some embedded parts exceeded limits or use unsupported media types.
        from: { type: string, nullable: true }
        from_name: { type: string, nullable: true }
        subject: { type: string }
        sent_at: { type: string, format: date-time, nullable: true }
        text: { type: string, nullable: true }
        html: { type: string, nullable: true }
        size_bytes: { type: integer }
        starred: { type: boolean }
        read_at: { type: string, format: date-time, nullable: true }
        received_at: { type: string, format: date-time }

    CalendarPreview:
      type: object
      required: [method, uid, title, start, end, organizer, unsupported]
      properties:
        method: { type: string }
        uid: { type: string }
        title: { type: string }
        start: { type: string }
        end: { type: string }
        organizer: { type: string }
        unsupported: { type: boolean }
        attendee:
          type: string
          description: Receiving mailbox address that may answer this external invitation.
        response: { type: string, enum: [accepted, tentative, declined] }

    ApiKey:
      type: object
      required: [id, name, key_prefix, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string, description: Leading characters only; never authenticates anything. }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: |
                The full key, returned once at creation. Only its digest is
                stored, so this is the only time it exists outside the caller.

    EmailStatus:
      type: string
      enum: [queued, processing, sent, failed, dead]
      description: |
        `sent` and `dead` are terminal. Delivery, bounces and complaints are
        events that happen afterwards, not statuses.

    SendEmailRequest:
      type: object
      required: [from, to]
      additionalProperties: false
      description: At least one of `html` or `text` must be present and non-blank.
      properties:
        from: { type: string, format: email }
        to:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: email }
        cc:
          type: array
          maxItems: 50
          items: { type: string, format: email }
        bcc:
          type: array
          maxItems: 50
          items: { type: string, format: email }
        subject: { type: string, maxLength: 998 }
        html: { type: string }
        text: { type: string }
        reply_to_message_id:
          type: string
          format: uuid
          description: Session sending only; an accessible received message to reply to.
        attachments:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
          description: |
            Ids from `POST /v1/attachments`. Each must belong to this
            workspace and not already be attached to another message; a
            missing or already-used id fails the whole request.

    Attachment:
      type: object
      required: [id, filename, content_type, size_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    SendEmailResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/EmailStatus' }
        error:
          type: string
          description: Present only when the transport refused the message.

    Email:
      type: object
      required: [id, workspace_id, from, to, subject, status, attempts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        from: { type: string, format: email }
        to:
          type: array
          items: { type: string, format: email }
        cc:
          type: array
          maxItems: 50
          items: { type: string, format: email }
        bcc:
          type: array
          maxItems: 50
          items: { type: string, format: email }
        subject: { type: string }
        html: { type: string, nullable: true }
        text: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/EmailStatus' }
        provider_message_id: { type: string, nullable: true }
        idempotency_key: { type: string, nullable: true }
        attempts: { type: integer }
        last_error: { type: string, nullable: true }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
